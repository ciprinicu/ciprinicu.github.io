name: Build, deploy and version 🚀

on:
  push:
    branches:
      - main

permissions:
  contents: write # OBLIGATORIU: Ca să poată crea tag-ul nou!

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Luăm codul cu TOT istoricul (fetch-depth: 0 e critic aici!)
      - name: Checkout 🛎️
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 

      # 2. GENERATORUL DE VERSIUNI (Soumeh-zz)
      - name: Auto Versioning 🏷️
        id: version # Îi dăm un ID ca să-l strigăm mai jos
        uses: Soumeh-zz/auto-versioning@v1.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Setări opționale (le poți șterge dacă vrei default):
          tag_prefix: "v"       # Pune "v" în față (v1.0.2)
          major_pattern: "major:"
          minor_pattern: "feat:"
          patch_pattern: "fix:"

      # 3. Setup Node.js
      - name: Setup Node.js 📦
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      # 4. Instalăm Workbox și restul
      - name: Install Dependencies 🔧
        run: |
          npm install
          npm install -g workbox-cli

      # 5. INJECTĂM VERSIUNEA CALCULATĂ
      - name: 🕒 Injectează Versiunea Soumeh
        run: |
          # Așa scoți versiunea din acțiunea lui Soumeh:
          NEW_VER="${{ steps.version.outputs.version }}"
          
          echo "🚀 Versiunea calculată este: $NEW_VER"
          
          # Injectăm în HTML
          sed -i "s/VERSION_PLACEHOLDER/$NEW_VER/g" index.html
          
          # Injectăm în Service Worker (sursa)
          sed -i "s/VERSION_PLACEHOLDER/$NEW_VER/g" src-sw.js

      # 6. Build (Generare SW Final)
      - name: 🏗️ Build Project
        run: npm run build

      # 7. Deploy pe GitHub Pages
      - name: 🚀 Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: .
          branch: gh-pages