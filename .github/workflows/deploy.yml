name: Auto Deploy & Semantic Version 🚀

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 

      - name: Bump Version and Push Tag 🏷️
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch # Asigură că face bump la orice commit
          tag_prefix: "v"

      - name: Setup Node.js 📦
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies 🔧
        run: |
          npm install
          npm install -g workbox-cli

      # AICI E SCHIMBAREA DE SIGURANȚĂ 🚨
      - name: 🕒 Injectează Versiunea (Cu Fallback)
        run: |
          # Luăm ambele valori
          NEW_TAG="${{ steps.tag_version.outputs.new_tag }}"
          PREV_TAG="${{ steps.tag_version.outputs.previous_tag }}"
          
          # Verificăm: E gol noul tag?
          if [ -z "$NEW_TAG" ]; then
            echo "⚠️ Nu s-a generat versiune nouă. Rămânem pe aia veche."
            FINAL_VER="$PREV_TAG"
          else
            echo "🚀 Avem versiune nouă proaspătă!"
            FINAL_VER="$NEW_TAG"
          fi
          
          # Dacă și PREV_TAG e gol (primul run ever), punem o valoare default
          if [ -z "$FINAL_VER" ] || [ "$FINAL_VER" == "v0.0.0" ]; then
             FINAL_VER="v1.0.0"
          fi

          echo "✅ Versiunea finală care intră pe site: $FINAL_VER"
          
          # Injectăm în HTML
          sed -i "s/VERSION_PLACEHOLDER/$FINAL_VER/g" index.html
          
          # Injectăm în SW
          sed -i "s/VERSION_PLACEHOLDER/$FINAL_VER/g" src-sw.js

      - name: 🏗️ Build Project
        run: npm run build

      - name: 🚀 Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: .
          branch: gh-pages